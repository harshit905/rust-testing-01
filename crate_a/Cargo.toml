[package]
name = "crate_a"
version = "0.1.0"
edition = "2021"

[dependencies]
# Exact pin (cargo needs a leading `=`) to a KNOWN-VULNERABLE version.
# smallvec 1.6.0 has a buffer overflow (CVE-2021-25900 / RUSTSEC-2021-0003),
# fixed in 1.6.1. Zero dependencies. Expected: VULNERABLE.
smallvec = "=1.6.0"

# A second KNOWN-VULNERABLE crate that ALSO pulls transitive dependencies.
# time 0.1.43 has a segfault via localtime (RUSTSEC-2020-0071 / CVE-2020-26235),
# and drags in libc / winapi as transitives. Expected: VULNERABLE, its
# transitives HEALTHY. Tests transitive discovery.
time = "=0.1.43"

# Round 2: version inherited from [workspace.dependencies] in the root
# Cargo.toml. Classification must resolve `workspace = true` to a DIRECT dep.
generic-array = { workspace = true }

# Round 2: a target-specific dependency table. Cargo.lock records it for every
# target, so it must be classified DIRECT even though it is not under plain
# [dependencies]. nix 0.17.0 is vulnerable (RUSTSEC-2021-0119 / CVE-2021-45707).
[target.'cfg(unix)'.dependencies]
nix = "=0.17.0"
